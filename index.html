<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>河海特考航海人員測驗雲端學習工作站</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen p-4 pb-20">

    <div class="max-w-3xl mx-auto">
        <!-- 頂部標題區 -->
        <header class="text-center my-6">
            <span class="text-xs font-bold tracking-widest text-blue-600 bg-blue-50 px-3 py-1 rounded-full uppercase border border-blue-100">Maritime Certification Station</span>
            <h1 class="text-2xl md:text-3xl font-extrabold text-blue-950 mt-2">河海特考航海人員測驗總複習庫</h1>
            <p class="text-xs md:text-sm text-slate-500 mt-1.5">一等/二等船副 · 五大專業科目、COLREGs 與 SOLAS 應急規範</p>
        </header>

        <!-- 即時關鍵字搜尋框 -->
        <div class="mb-5">
            <input type="text" id="search-input" placeholder="🔍 搜尋全站關鍵字、公式或條文（例如：Rule 15, MOB, 緯度...）" 
                   class="w-full p-3.5 text-sm bg-white border border-slate-200 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
        </div>

        <!-- 科目與法規分頁導覽 -->
        <div class="grid grid-cols-2 md:grid-cols-7 gap-2 mb-6" id="category-buttons">
            <button id="btn-nav" onclick="switchCategory('nav')" class="p-2.5 text-xs font-semibold rounded-xl bg-blue-600 text-white shadow transition">1. 航海學</button>
            <button id="btn-safety" onclick="switchCategory('safety')" class="p-2.5 text-xs font-semibold rounded-xl bg-white text-slate-700 border border-slate-200 shadow-sm transition">2. 航安與氣象</button>
            <button id="btn-english" onclick="switchCategory('english')" class="p-2.5 text-xs font-semibold rounded-xl bg-white text-slate-700 border border-slate-200 shadow-sm transition">3. 船舶通訊與英文</button>
            <button id="btn-cargo" onclick="switchCategory('cargo')" class="p-2.5 text-xs font-semibold rounded-xl bg-white text-slate-700 border border-slate-200 shadow-sm transition">4. 貨物作業</button>
            <button id="btn-management" onclick="switchCategory('management')" class="p-2.5 text-xs font-semibold rounded-xl bg-white text-slate-700 border border-slate-200 shadow-sm transition">5. 船舶操作與管理</button>
            <button id="btn-colregs" onclick="switchCategory('colregs')" class="p-2.5 text-xs font-semibold rounded-xl bg-amber-500 text-white shadow transition">📜 避碰規則</button>
            <button id="btn-solas" onclick="switchCategory('solas')" class="p-2.5 text-xs font-semibold rounded-xl bg-emerald-600 text-white shadow transition">⚓ SOLAS 應急</button>
        </div>

        <!-- 主內容顯示區 -->
        <main id="content-area" class="space-y-4">
            <!-- JavaScript 動態渲染內容 -->
        </main>
    </div>

    <!-- 載入所有模組化資料檔案 -->
    <script src="colregs.js"></script>
    <script src="solas.js"></script>
    <script src="nav.js"></script>
    <script src="safety.js"></script>
    <script src="english.js"></script>
    <script src="cargo.js"></script>
    <script src="management.js"></script>
    <script src="database.js"></script>

    <script>
        let currentCat = 'nav';
        let currentFilter = 'all';

        function switchCategory(catKey) {
            currentCat = catKey;
            currentFilter = 'all'; 
            const searchInput = document.getElementById('search-input');
            if (searchInput) searchInput.value = '';

            const keys = ['nav', 'safety', 'english', 'cargo', 'management', 'colregs', 'solas'];
            keys.forEach(k => {
                const btn = document.getElementById(`btn-${k}`);
                if (btn) {
                    if (k === catKey) {
                        if (k === 'colregs') btn.className = "p-2.5 text-xs font-semibold rounded-xl bg-amber-600 text-white shadow transition ring-2 ring-amber-300";
                        else if (k === 'solas') btn.className = "p-2.5 text-xs font-semibold rounded-xl bg-emerald-700 text-white shadow transition ring-2 ring-emerald-300";
                        else btn.className = "p-2.5 text-xs font-semibold rounded-xl bg-blue-600 text-white shadow transition";
                    } else {
                        if (k === 'colregs') btn.className = "p-2.5 text-xs font-semibold rounded-xl bg-amber-50 text-amber-800 border border-amber-200 shadow-sm transition";
                        else if (k === 'solas') btn.className = "p-2.5 text-xs font-semibold rounded-xl bg-emerald-50 text-emerald-800 border border-emerald-200 shadow-sm transition";
                        else btn.className = "p-2.5 text-xs font-semibold rounded-xl bg-white text-slate-700 border border-slate-200 shadow-sm transition";
                    }
                }
            });

            renderCurrentView();
        }

        function setFilter(filterType) {
            currentFilter = filterType;
            renderCurrentView();
        }

        function renderCurrentView(searchQuery = '') {
            if (!window.db) return;

            if (currentCat === 'colregs') {
                let rules = window.db.colregs || [];
                if (searchQuery) {
                    rules = rules.filter(r => r.rule.toLowerCase().includes(searchQuery) || r.title.toLowerCase().includes(searchQuery) || r.zh.includes(searchQuery));
                } else {
                    if (currentFilter === 'important') rules = rules.filter(r => r.level === 'important');
                    if (currentFilter === 'secondary') rules = rules.filter(r => r.level === 'secondary');
                }
                renderRuleList(rules, "1972 年國際海上避碰規則 (COLREGs) 中英文對照庫", "amber");
            } else if (currentCat === 'solas') {
                let rules = window.db.solas || [];
                if (searchQuery) {
                    rules = rules.filter(r => r.rule.toLowerCase().includes(searchQuery) || r.title.toLowerCase().includes(searchQuery) || r.zh.includes(searchQuery));
                } else {
                    if (currentFilter === 'important') rules = rules.filter(r => r.level === 'important');
                    if (currentFilter === 'secondary') rules = rules.filter(r => r.level === 'secondary');
                }
                renderRuleList(rules, "SOLAS 國際海上人命安全公約 - 應急警報與鳴笛規範庫", "emerald");
            } else if (window.db[currentCat]) {
                const activeData = window.db[currentCat];
                if (currentCat === 'nav') {
                    renderNavData(activeData, searchQuery);
                } else {
                    renderData(activeData.terms || [], activeData.quizzes || [], activeData.title || '', searchQuery);
                }
            }
        }

        function renderRuleList(rules, headerTitle, themeColor) {
            const area = document.getElementById('content-area');
            if (!area) return;

            let borderTheme = themeColor === 'amber' ? 'border-amber-500 bg-amber-50 text-amber-950' : 'border-emerald-500 bg-emerald-50 text-emerald-950';
            let badgeTheme = themeColor === 'amber' ? 'bg-amber-100 text-amber-800' : 'bg-emerald-100 text-emerald-800';

            let filterButtonsHTML = `
                <div class="flex space-x-2 mb-4">
                    <button onclick="setFilter('all')" class="px-3 py-1.5 text-xs font-bold rounded-lg ${currentFilter === 'all' ? (themeColor==='amber'?'bg-amber-600':'bg-emerald-600') + ' text-white shadow' : 'bg-white text-slate-700 border border-slate-200'} transition">全部條文</button>
                    <button onclick="setFilter('important')" class="px-3 py-1.5 text-xs font-bold rounded-lg ${currentFilter === 'important' ? (themeColor==='amber'?'bg-amber-600':'bg-emerald-600') + ' text-white shadow' : 'bg-white text-slate-700 border border-slate-200'} transition">⭐ 重要（高頻考點）</button>
                    <button onclick="setFilter('secondary')" class="px-3 py-1.5 text-xs font-bold rounded-lg ${currentFilter === 'secondary' ? (themeColor==='amber'?'bg-amber-600':'bg-emerald-600') + ' text-white shadow' : 'bg-white text-slate-700 border border-slate-200'} transition">📌 補充規範</button>
                </div>
            `;

            let rulesHTML = rules.length > 0 ? rules.map(r => `
                <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-100 hover:border-slate-300 transition">
                    <div class="flex items-center justify-between border-b border-slate-100 pb-2 mb-3">
                        <div class="flex items-center space-x-2">
                            <span class="${badgeTheme} font-bold text-xs px-2.5 py-1 rounded-md font-mono">${r.rule}</span>
                            <h3 class="font-bold text-slate-900 text-base">${r.title}</h3>
                        </div>
                        <span class="text-xs px-2 py-0.5 rounded-full font-semibold ${r.level === 'important' ? badgeTheme : 'bg-slate-100 text-slate-600'}">
                            ${r.level === 'important' ? '⭐ 重要' : '📌 補充'}
                        </span>
                    </div>
                    <div class="space-y-2">
                        <p class="text-sm font-medium text-slate-800 leading-relaxed bg-slate-50 p-3 rounded-lg border border-slate-100 whitespace-pre-line">
                            <span class="text-slate-900 font-bold block text-xs uppercase mb-1">中文規範 / 條文：</span>${r.zh}
                        </p>
                        <p class="text-xs text-slate-600 font-mono leading-relaxed bg-slate-50/50 p-3 rounded-lg">
                            <span class="text-slate-400 font-bold block text-xs tracking-wider mb-1">ENGLISH TEXT:</span>${r.en}
                        </p>
                    </div>
                </div>
            `).join('') : '<p class="text-xs text-slate-400 py-4 text-center">沒有符合條件的條文</p>';

            area.innerHTML = `
                <div class="mb-4 border-l-4 p-4 rounded-r-xl ${borderTheme}">
                    <h2 class="text-lg font-bold">${headerTitle}</h2>
                    <p class="text-xs opacity-80 mt-1">點擊下方按鈕可快速過濾核心高頻考點與應急規範。</p>
                </div>
                ${filterButtonsHTML}
                <div class="space-y-4">
                    ${rulesHTML}
                </div>
            `;
        }

        function renderNavData(data, searchQuery = '') {
            const area = document.getElementById('content-area');
            if (!area) return;

            let terms = data.terms || [];
            let formulas = data.formulas || [];
            let quizzes = data.quizzes || [];

            if (searchQuery) {
                terms = terms.filter(t => t.en.toLowerCase().includes(searchQuery) || t.zh.includes(searchQuery) || t.desc.includes(searchQuery));
                formulas = formulas.filter(f => f.name.toLowerCase().includes(searchQuery) || f.expr.toLowerCase().includes(searchQuery) || f.desc.includes(searchQuery));
                quizzes = quizzes.filter(q => q.q.toLowerCase().includes(searchQuery) || q.answer.includes(searchQuery));
            }

            let termsHTML = terms.map(t => `
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100">
                    <div class="flex justify-between items-start">
                        <h4 class="font-bold text-slate-900 text-sm">${t.zh}</h4>
                        <span class="text-xs font-mono bg-blue-50 text-blue-700 px-2 py-0.5 rounded">${t.en}</span>
                    </div>
                    <p class="text-xs text-slate-600 mt-2 leading-relaxed">${t.desc}</p>
                </div>
            `).join('');

            let formulasHTML = formulas.map(f => `
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100">
                    <h4 class="font-bold text-slate-900 text-sm">${f.name}</h4>
                    <div class="my-2 p-2.5 bg-slate-900 text-emerald-400 font-mono text-xs rounded-lg">${f.expr}</div>
                    <p class="text-xs text-slate-600 leading-relaxed">${f.desc}</p>
                </div>
            `).join('');

            let quizzesHTML = quizzes.map((q, idx) => `
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100">
                    <p class="text-sm font-bold text-slate-900 mb-3">Q${idx+1}. ${q.q}</p>
                    <div class="space-y-1.5 mb-3">
                        ${q.options.map(opt => `<div class="text-xs text-slate-700 p-2 bg-slate-50 rounded-lg">${opt}</div>`).join('')}
                    </div>
                    <button onclick="toggleAnswer(this)" data-answer="${q.answer}" class="w-full py-2 text-xs font-bold text-blue-600 bg-blue-50 hover:bg-blue-100 rounded-lg transition">查看解答</button>
                </div>
            `).join('');

            area.innerHTML = `
                <div class="mb-4 border-l-4 border-blue-600 bg-blue-50 p-4 rounded-r-xl text-blue-950">
                    <h2 class="text-lg font-bold">${data.title}</h2>
                    <p class="text-xs opacity-80 mt-1">涵蓋地文航海、天文航海、電航與 125+ 核心名詞及計算公式庫。</p>
                </div>
                <div class="space-y-6">
                    <div>
                        <h3 class="text-sm font-bold text-slate-900 mb-3 uppercase tracking-wider">📖 核心專有名詞 (${terms.length})</h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">${termsHTML || '<p class="text-xs text-slate-400">無符合名詞</p>'}</div>
                    </div>
                    <div>
                        <h3 class="text-sm font-bold text-slate-900 mb-3 uppercase tracking-wider">📐 核心公式與計算 (${formulas.length})</h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">${formulasHTML || '<p class="text-xs text-slate-400">無符合公式</p>'}</div>
                    </div>
                    <div>
                        <h3 class="text-sm font-bold text-slate-900 mb-3 uppercase tracking-wider">📝 歷屆考題精選 (${quizzes.length})</h3>
                        <div class="space-y-3">${quizzesHTML || '<p class="text-xs text-slate-400">無符合考題</p>'}</div>
                    </div>
                </div>
            `;
        }

        function renderData(terms, quizzes, title, searchQuery = '') {
            const area = document.getElementById('content-area');
            if (!area) return;

            if (searchQuery) {
                terms = terms.filter(t => t.en.toLowerCase().includes(searchQuery) || t.zh.includes(searchQuery) || t.desc.includes(searchQuery));
                quizzes = quizzes.filter(q => q.q.toLowerCase().includes(searchQuery) || q.answer.includes(searchQuery));
            }

            let termsHTML = terms.map(t => `
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100">
                    <div class="flex justify-between items-start">
                        <h4 class="font-bold text-slate-900 text-sm">${t.zh}</h4>
                        <span class="text-xs font-mono bg-blue-50 text-blue-700 px-2 py-0.5 rounded">${t.en}</span>
                    </div>
                    <p class="text-xs text-slate-600 mt-2 leading-relaxed">${t.desc}</p>
                </div>
            `).join('');

            let quizzesHTML = quizzes.map((q, idx) => `
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100">
                    <p class="text-sm font-bold text-slate-900 mb-3">Q${idx+1}. ${q.q}</p>
                    <div class="space-y-1.5 mb-3">
                        ${q.options.app.map ? '' : ''}
                        ${q.options.map(opt => `<div class="text-xs text-slate-700 p-2 bg-slate-50 rounded-lg">${opt}</div>`).join('')}
                    </div>
                    <button onclick="toggleAnswer(this)" data-answer="${q.answer}" class="w-full py-2 text-xs font-bold text-blue-600 bg-blue-50 hover:bg-blue-100 rounded-lg transition">查看解答</button>
                </div>
            `).join('');

            area.innerHTML = `
                <div class="mb-4 border-l-4 border-blue-600 bg-blue-50 p-4 rounded-r-xl text-blue-950">
                    <h2 class="text-lg font-bold">${title}</h2>
                    <p class="text-xs opacity-80 mt-1">國考高頻專有名詞與實務應變題庫。</p>
                </div>
                <div class="space-y-6">
                    <div>
                        <h3 class="text-sm font-bold text-slate-900 mb-3 uppercase tracking-wider">📖 核心專有名詞與應變信號 (${terms.length})</h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">${termsHTML || '<p class="text-xs text-slate-400">無符合名詞</p>'}</div>
                    </div>
                    <div>
                        <h3 class="text-sm font-bold text-slate-900 mb-3 uppercase tracking-wider">📝 歷屆考題精選 (${quizzes.length})</h3>
                        <div class="space-y-3">${quizzesHTML || '<p class="text-xs text-slate-400">無符合考題</p>'}</div>
                    </div>
                </div>
            `;
        }

        function toggleAnswer(btn) {
            const answer = btn.getAttribute('data-answer');
            btn.outerHTML = `<div class="p-3 bg-emerald-50 border border-emerald-200 rounded-lg text-sm text-emerald-800 font-semibold text-center leading-relaxed">正確答案：${answer}</div>`;
        }

        document.addEventListener('DOMContentLoaded', function() {
            const searchInput = document.getElementById('search-input');
            if (searchInput) {
                searchInput.addEventListener('input', (e) => {
                    const query = e.target.value.trim().toLowerCase();
                    renderCurrentView(query);
                });
            }

            switchCategory('nav');
        });
    </script>
</body>
</html>
