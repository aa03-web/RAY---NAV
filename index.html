<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>河海特考航海人員測驗雲端學習工作站</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen p-4 pb-20">

    <div class="max-w-3xl mx-auto">
        <!-- 頂部標題區 -->
        <header class="text-center my-6">
            <span class="text-xs font-bold tracking-widest text-blue-600 bg-blue-50 px-3 py-1 rounded-full uppercase border border-blue-100">Maritime Certification Station</span>
            <h1 class="text-2xl md:text-3xl font-extrabold text-blue-950 mt-2">河海特考航海人員測驗總複習庫</h1>
            <p class="text-xs md:text-sm text-slate-500 mt-1.5">一等/二等船副 · 五大核心專業科目與 COLREGs 完整法規庫</p>
        </header>

        <!-- 即時關鍵字搜尋框 -->
        <div class="mb-5">
            <input type="text" id="search-input" placeholder="🔍 搜尋全站關鍵字或避碰條文（例如：Rule 15, AIS, 大圓, 颱風, 避碰, SMCP...）" 
                   class="w-full p-3.5 text-sm bg-white border border-slate-200 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
        </div>

        <!-- 科目與法規分頁導覽 -->
        <div class="grid grid-cols-2 md:grid-cols-6 gap-2 mb-6" id="category-buttons">
            <button id="btn-nav" class="p-2.5 text-xs font-semibold rounded-xl bg-blue-600 text-white shadow transition">1. 航海學</button>
            <button id="btn-safety" class="p-2.5 text-xs font-semibold rounded-xl bg-white text-slate-700 border border-slate-200 shadow-sm transition">2. 航行安全與氣象</button>
            <button id="btn-english" class="p-2.5 text-xs font-semibold rounded-xl bg-white text-slate-700 border border-slate-200 shadow-sm transition">3. 船舶通訊與英文</button>
            <button id="btn-cargo" class="p-2.5 text-xs font-semibold rounded-xl bg-white text-slate-700 border border-slate-200 shadow-sm transition">4. 貨物作業</button>
            <button id="btn-management" class="p-2.5 text-xs font-semibold rounded-xl bg-white text-slate-700 border border-slate-200 shadow-sm transition">5. 船舶操作與管理</button>
            <button id="btn-colregs" class="p-2.5 text-xs font-semibold rounded-xl bg-amber-500 text-white shadow transition">📜 避碰規則條文</button>
        </div>

        <!-- 主內容顯示區 -->
        <main id="content-area" class="space-y-4">
            <!-- JavaScript 動態渲染內容 -->
        </main>
    </div>

    <!-- 載入外部獨立資料庫 -->
    <script src="database.js"></script>

    <script>
        let currentCat = 'nav';

        function switchCategory(catKey) {
            currentCat = catKey;
            const searchInput = document.getElementById('search-input');
            if (searchInput) searchInput.value = '';

            const keys = ['nav', 'safety', 'english', 'cargo', 'management', 'colregs'];
            keys.forEach(k => {
                const btn = document.getElementById(`btn-${k}`);
                if (btn) {
                    if (k === catKey) {
                        btn.className = k === 'colregs' 
                            ? "p-2.5 text-xs font-semibold rounded-xl bg-amber-600 text-white shadow transition ring-2 ring-amber-300"
                            : "p-2.5 text-xs font-semibold rounded-xl bg-blue-600 text-white shadow transition";
                    } else {
                        btn.className = k === 'colregs' 
                            ? "p-2.5 text-xs font-semibold rounded-xl bg-amber-50 text-amber-800 border border-amber-200 shadow-sm transition"
                            : "p-2.5 text-xs font-semibold rounded-xl bg-white text-slate-700 border border-slate-200 shadow-sm transition";
                    }
                }
            });

            if (catKey === 'colregs') {
                renderCOLREGs(window.db.colregs);
            } else if (window.db && window.db[catKey]) {
                renderData(window.db[catKey].terms, window.db[catKey].quizzes, window.db[catKey].title);
            }
        }

        function renderCOLREGs(rules) {
            const area = document.getElementById('content-area');
            if (!area) return;

            let rulesHTML = rules.map(r => `
                <div class="bg-white p-5 rounded-xl shadow-sm border border-amber-100 hover:border-amber-300 transition">
                    <div class="flex items-center space-x-2 border-b border-slate-100 pb-2 mb-3">
                        <span class="bg-amber-100 text-amber-800 font-bold text-xs px-2.5 py-1 rounded-md font-mono">${r.rule}</span>
                        <h3 class="font-bold text-slate-900 text-base">${r.title}</h3>
                    </div>
                    <div class="space-y-2">
                        <p class="text-sm font-medium text-slate-800 leading-relaxed bg-amber-50/50 p-3 rounded-lg border border-amber-50">
                            <span class="text-amber-900 font-bold block text-xs uppercase mb-1">中文條文：</span>${r.zh}
                        </p>
                        <p class="text-xs text-slate-600 font-mono leading-relaxed bg-slate-50 p-3 rounded-lg">
                            <span class="text-slate-400 font-bold block text-xs tracking-wider mb-1">ENGLISH TEXT:</span>${r.en}
                        </p>
                    </div>
                </div>
            `).join('');

            area.innerHTML = `
                <div class="mb-4 bg-amber-50 border-l-4 border-amber-500 p-4 rounded-r-xl">
                    <h2 class="text-lg font-bold text-amber-950">1972 年國際海上避碰規則 (COLREGs) 中英文對照庫</h2>
                    <p class="text-xs text-amber-700 mt-1">收錄二等與一等船副國考必考之核心條文，點擊關鍵字搜尋可精準查閱特定 Rule。</p>
                </div>
                <div class="space-y-4">
                    ${rulesHTML}
                </div>
            `;
        }

        function renderData(terms, quizzes, title) {
            const area = document.getElementById('content-area');
            if (!area) return;

            let termsHTML = terms.length > 0 ? terms.map(t => `
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100">
                    <div class="flex justify-between items-start">
                        <h3 class="font-bold text-blue-900">${t.zh}</h3>
                        <span class="text-xs bg-slate-100 text-slate-600 px-2 py-0.5 rounded font-mono">${t.en}</span>
                    </div>
                    <p class="text-sm text-slate-600 mt-2 leading-relaxed">${t.desc}</p>
                </div>
            `).join('') : '<p class="text-xs text-slate-400 py-2">無符合的名詞</p>';

            let quizzesHTML = quizzes.length > 0 ? quizzes.map((quiz, index) => `
                <div class="mt-3 bg-blue-50/70 border border-blue-100 p-4 rounded-xl">
                    <span class="text-xs font-bold text-blue-600 tracking-wider uppercase">河海特考真題 ${index + 1}</span>
                    <p class="text-sm font-medium text-slate-800 my-2">${quiz.q}</p>
                    <div class="space-y-1.5 mb-3">
                        ${quiz.options.map(opt => `<div class="text-xs text-slate-600 bg-white/80 p-2 rounded border border-slate-100">${opt}</div>`).join('')}
                    </div>
                    <button onclick="window.toggleAnswer(this)" data-answer="${quiz.answer}" class="w-full py-2 bg-blue-600 text-white rounded-lg text-sm font-medium shadow hover:bg-blue-700 transition">顯示答案與解析</button>
                </div>
            `).join('') : '<p class="text-xs text-slate-400 py-2">無符合的考題</p>';

            area.innerHTML = `
                <div class="mb-3">
                    <h2 class="text-lg font-bold text-slate-900 border-l-4 border-blue-600 pl-3">${title}</h2>
                </div>
                <div class="space-y-3">
                    <h3 class="text-xs font-bold text-slate-400 tracking-wider uppercase">重點名詞與概念 (${terms.length})</h3>
                    ${termsHTML}
                </div>
                <div class="mt-6">
                    <h3 class="text-xs font-bold text-slate-400 tracking-wider uppercase mb-2">考古題精選 (${quizzes.length})</h3>
                    ${quizzesHTML}
                </div>
            `;
        }

        function handleGlobalSearch() {
            const kw = document.getElementById('search-input').value.trim().toLowerCase();
            if (!kw || !window.db) {
                switchCategory(currentCat);
                return;
            }

            if (currentCat === 'colregs') {
                const matched = window.db.colregs.filter(r => r.rule.toLowerCase().includes(kw) || r.title.toLowerCase().includes(kw) || r.zh.toLowerCase().includes(kw) || r.en.toLowerCase().includes(kw));
                renderCOLREGs(matched);
            } else {
                const activeData = window.db[currentCat];
                if (!activeData) return;

                const matchedTerms = activeData.terms.filter(t => t.zh.toLowerCase().includes(kw) || t.en.toLowerCase().includes(kw) || t.desc.toLowerCase().includes(kw));
                const matchedQuizzes = activeData.quizzes.filter(q => q.q.toLowerCase().includes(kw) || q.options.some(o => o.toLowerCase().includes(kw)));

                renderData(matchedTerms, matchedQuizzes, `${activeData.title} - 檢索結果`);
            }
        }

        window.toggleAnswer = function(btn) {
            const answer = btn.getAttribute('data-answer');
            btn.outerHTML = `<div class="p-3 bg-emerald-50 border border-emerald-200 rounded-lg text-sm text-emerald-800 font-semibold text-center leading-relaxed">正確答案：${answer}</div>`;
        };

        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('btn-nav').addEventListener('click', () => switchCategory('nav'));
            document.getElementById('btn-safety').addEventListener('click', () => switchCategory('safety'));
            document.getElementById('btn-english').addEventListener('click', () => switchCategory('english'));
            document.getElementById('btn-cargo').addEventListener('click', () => switchCategory('cargo'));
            document.getElementById('btn-management').addEventListener('click', () => switchCategory('management'));
            document.getElementById('btn-colregs').addEventListener('click', () => switchCategory('colregs'));

            document.getElementById('search-input').addEventListener('input', handleGlobalSearch);

            switchCategory('nav');
        });
    </script>
</body>
</html>
